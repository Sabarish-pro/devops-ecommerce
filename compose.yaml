services:
  web:
    image: devops-ecommerce:2.2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5004:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
